[project]
name = "ielts-ai-service"
version = "0.1.0"
description = "GPU-VPS-hosted FastAPI service for IELTS Trainer (Llama 3.1, Whisper, Piper)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "ollama>=0.4.4",
    "openai-whisper>=20231117",
    "torch>=2.5",
    "torchaudio>=2.5",
    "piper-tts>=1.2.0",
    "soundfile>=0.12.1",
    "numpy>=1.26",
    "rapidfuzz>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
